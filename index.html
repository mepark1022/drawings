<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>현장 도면 열람</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 홈(현장 카드) → 현장(분류별 도면 카드) → 도면 보기(전체화면 캔버스). 해시 주소로 화면 전환 */
:root {
  --bg: #f3f5f7;
  --panel: #ffffff;
  --line: #dce1e7;
  --fg: #15202b;
  --muted: #5f6c7a;
  --accent: #1d6ce0;
  --accent-soft: #e4eefc;
  --sheet: #0b0e12;
  --font-ui: "IBM Plex Sans KR", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1217; --panel: #161c23; --line: #2a333e; --fg: #e4e9ee; --muted: #8e9aa7;
    --accent: #5d9dff; --accent-soft: #1b2a3f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1217; --panel: #161c23; --line: #2a333e; --fg: #e4e9ee; --muted: #8e9aa7;
  --accent: #5d9dff; --accent-soft: #1b2a3f; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
button { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- 목록 화면 (홈·현장) ---------- */
.page {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; justify-content: space-between; margin-bottom: 22px; }
.top h1 { font-size: clamp(22px, 4vw, 30px); line-height: 1.25; margin: 0; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.top p { margin: 4px 0 0; color: var(--muted); }
.crumb { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 14px; margin-bottom: 8px; flex-wrap: wrap; }
.crumb a:hover { color: var(--accent); }
.search { position: relative; flex: 0 1 320px; min-width: 0; width: 100%; }
.search input {
  width: 100%; height: 42px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); color: var(--fg);
  padding: 0 12px 0 38px; font: inherit; box-sizing: border-box;
}
.search svg { position: absolute; left: 12px; top: 13px; width: 16px; height: 16px; color: var(--muted); }

.sites { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
.site {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;
  transition: border-color .15s, transform .15s;
}
.site:hover { border-color: var(--accent); transform: translateY(-2px); }
.site .ph { aspect-ratio: 1.41; background: var(--sheet); display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; max-width: 100%; }
.site .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.site .ph img:first-child { grid-row: span 2; }
.site .meta { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 3px; }
.site .tag { font-family: var(--font-mono); font-size: 12px; color: var(--accent); letter-spacing: .04em; }
.site h2 { margin: 0; font-size: 18px; font-weight: 600; }
.site .sub { color: var(--muted); font-size: 14px; }
.site .cnt { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 3px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }

.cat { margin-top: 30px; }
.cat h3 { font-size: 13px; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
.cat h3 b { color: var(--fg); font-size: 16px; letter-spacing: 0; }
.sheets { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column;
  transition: border-color .15s;
}
.card:hover { border-color: var(--accent); }
.card img { width: 100%; aspect-ratio: 640 / 454; object-fit: cover; display: block; background: var(--sheet); max-width: 100%; }
.card .cap { padding: 9px 12px 11px; display: flex; gap: 9px; align-items: baseline; min-width: 0; }
.card .no { font-family: var(--font-mono); font-size: 12px; color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
.card .nm { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .st { display: block; font-size: 12px; color: var(--muted); }
.empty { color: var(--muted); padding: 30px 0; }
.foot { margin-top: 40px; color: var(--muted); font-size: 13px; }

@media (max-width: 560px) {
  .page { padding-block: 18px 40px; }
  .sites { grid-template-columns: 1fr; }
  .sheets { grid-template-columns: 1fr 1fr; gap: 10px; }
  .card .cap { flex-direction: column; gap: 0; padding: 7px 9px 9px; }
  .card .nm { font-size: 14px; }
}

/* ---------- 도면 보기 ---------- */
.viewer { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--sheet); z-index: 20; }
.vbar {
  flex: none; display: flex; align-items: center; gap: 8px; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px));
  min-height: 54px; box-sizing: border-box;
}
.vt { flex: 1; min-width: 0; line-height: 1.25; }
.vt b { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vt span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn {
  height: 36px; min-width: 36px; padding: 0 10px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; flex: none;
}
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .35; cursor: default; border-color: var(--line); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn svg { width: 16px; height: 16px; flex: none; }
.vbody { flex: 1; display: flex; min-height: 0; position: relative; }
.stage { flex: 1; position: relative; overflow: hidden; touch-action: none; min-width: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
canvas.drag { cursor: grabbing; }
canvas.measure { cursor: crosshair; }
.hud {
  position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); font-family: var(--font-mono); font-size: 11px;
  background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px;
  color: var(--muted); pointer-events: none; font-variant-numeric: tabular-nums; display: flex; gap: 12px;
}
.zoom { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; }
.zoom .btn { width: 40px; height: 40px; font-size: 18px; padding: 0; }
.mtip {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--accent);
  padding: 6px 12px; border-radius: 6px; font-size: 13px; white-space: nowrap; max-width: calc(100% - 20px); overflow: hidden; text-overflow: ellipsis;
}
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: #9aa6b2; text-align: center; background: var(--sheet); }
.loading .barp { width: 200px; height: 3px; background: #26303a; border-radius: 2px; overflow: hidden; margin: 12px auto 0; }
.loading .barp i { display: block; height: 100%; width: 30%; background: var(--accent); animation: ld 1.1s ease-in-out infinite; }
@keyframes ld { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
@media (prefers-reduced-motion: reduce) { .loading .barp i { animation: none; width: 100%; } .site, .site:hover { transition: none; transform: none; } }
.layers {
  width: 270px; flex: none; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0;
}
.layers .lt { display: flex; gap: 6px; padding: 8px; border-bottom: 1px solid var(--line); }
.layers input[type=search] { flex: 1; min-width: 0; height: 34px; border: 1px solid var(--line); border-radius: 6px; padding: 0 9px; background: var(--bg); color: var(--fg); font: inherit; font-size: 14px; }
.layers .ll { overflow-y: auto; flex: 1; padding: 4px 6px; padding-bottom: env(safe-area-inset-bottom, 0px); }
.ly { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.ly:hover { background: var(--accent-soft); }
.ly .sw { width: 12px; height: 12px; border-radius: 2px; border: 1px solid var(--line); flex: none; }
.ly span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ly input { margin: 0; accent-color: var(--accent); }
.only-wide { display: inline; }
@media (max-width: 760px) {
  .only-wide { display: none; }
  .layers { position: absolute; left: 0; right: 0; bottom: 0; height: 55%; width: auto; border-left: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; z-index: 3; box-shadow: 0 -8px 24px rgba(0,0,0,.25); }
}
.vtools { display: flex; gap: 8px; align-items: center; flex: none; }
@media (max-width: 560px) {
  .vbar { flex-wrap: wrap; row-gap: 6px; padding-bottom: 8px; }
  .vtools { flex: 1 1 100%; justify-content: space-between; }
}
</style>

<!-- 홈 -->
<main id="vHome" class="page">
  <div class="top">
    <div>
      <h1>현장 도면 열람</h1>
      <p>현장 3곳 · 도면 30장 · 프로그램 설치 없이 바로 보기</p>
    </div>
    <label class="search"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg>
      <input id="q" type="search" placeholder="도면명 검색 (예: 1층, 기초, 창호)" aria-label="도면명 검색"></label>
  </div>
  <div id="homeBody"></div>
  <p class="foot">원본: AutoCAD 2018 DWG · 도면을 누르면 확대·이동·거리 측정을 할 수 있습니다.</p>
</main>

<!-- 현장 -->
<main id="vSite" class="page" hidden>
  <div class="crumb"><a href="#">전체 현장</a><span>›</span><span id="siteCrumb"></span></div>
  <div class="top">
    <div>
      <h1 id="siteTitle"></h1>
      <p id="siteSub"></p>
    </div>
  </div>
  <div id="siteBody"></div>
</main>

<!-- 도면 보기 -->
<section id="vView" class="viewer" hidden>
  <div class="vbar">
    <a class="btn" id="vBack" href="#" aria-label="목록으로">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 3 5 8l5 5"/></svg><span class="only-wide">목록</span>
    </a>
    <div class="vt"><b id="vName"></b><span id="vSub"></span></div>
    <div class="vtools">
    <button class="btn" id="vPrev" aria-label="이전 도면"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 3 5 8l5 5"/></svg><span class="only-wide">이전</span></button>
    <button class="btn" id="vNext" aria-label="다음 도면"><span class="only-wide">다음</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m6 3 5 5-5 5"/></svg></button>
    <button class="btn" id="vFit" aria-label="도면 전체 보기" title="도면 전체 보기"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button>
    <button class="btn" id="vMeasure" aria-pressed="false" title="두 점을 눌러 거리 측정" aria-label="거리 측정"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 11 11 2l3 3-9 9z"/><path d="M5 8l1.5 1.5M7 6l1.5 1.5M9 4l1.5 1.5"/></svg><span class="only-wide">측정</span></button>
    <button class="btn" id="vPaper" aria-pressed="false" title="흰 배경 / CAD 검정 배경" aria-label="배경 전환"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg></button>
    <button class="btn" id="vLayers" aria-pressed="false" title="레이어 켜기/끄기" aria-label="레이어"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m8 2 6 3-6 3-6-3z"/><path d="m2 8 6 3 6-3M2 11l6 3 6-3"/></svg></button>
    </div>
  </div>
  <div class="vbody">
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="hud"><span id="hudXY">X — Y —</span><span id="hudS"></span></div>
      <div class="zoom">
        <button class="btn" id="zIn" aria-label="확대">+</button>
        <button class="btn" id="zOut" aria-label="축소">−</button>
      </div>
      <div class="mtip" id="mtip" hidden></div>
      <div class="loading" id="loading"><div>도면 데이터를 불러오는 중<div class="barp"><i></i></div></div></div>
    </div>
    <aside class="layers" id="layerPanel" hidden>
      <div class="lt">
        <input id="layerQ" type="search" placeholder="레이어 검색" aria-label="레이어 검색">
        <button class="btn" id="lyAll">전체</button>
        <button class="btn" id="lyNone">해제</button>
      </div>
      <div class="ll" id="layerList"></div>
    </aside>
  </div>
</section>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);

  // ---------- 현장·도면 목록 (i = 원본 도곽 번호, 썸네일 th/NN.jpg) ----------
  const SITES = [
    { id: 'a', name: '수원 구운동', project: '근린생활시설 신축공사', addr: '수원시 권선구 구운동', office: '주식회사 신한 종합건축사사무소', cover: [7, 2, 1],
      sheets: [
        ['건축', '주단면도-1', 8], ['건축', '정면도', 10], ['건축', '지붕 및 옥탑 평면도 (1)', 12], ['건축', '지붕 및 옥탑 평면도 (2)', 13],
        ['구조평면', '주심도', 2], ['구조평면', '기초 구조평면도', 1], ['구조평면', '1층 구조평면도', 3], ['구조평면', '2층 구조평면도', 4],
        ['구조평면', '지붕층 구조평면도', 5], ['구조평면', '옥탑지붕층 구조평면도', 6]
      ] },
    { id: 'b', name: '수원 파장동', project: '근린생활시설 신축공사', addr: '수원시 장안구 파장동', office: '주식회사 신한 종합건축사사무소', cover: [1, 2, 3],
      sheets: [['창호', '창호일람표-1', 9], ['창호', '창호일람표-2', 7], ['창호', '창호일람표-3', 11]] },
    { id: 'c', name: '화성 동화리', project: '제2종 근린생활시설', addr: '화성시 봉담읍 동화리 562-4번지', office: '이림 건축사사무소', cover: [1, 6, 11],
      sheets: [
        ['건축', '1층 평면도', 15], ['건축', '2층 평면도', 17],
        ['구조평면', '주심도', 14], ['구조평면', 'PILE 구조평면도', 16], ['구조평면', '기초 구조평면도', 18], ['구조평면', '1층바닥 구조평면도', 19],
        ['구조평면', '2층바닥 구조평면도', 20], ['구조평면', '3·4층바닥 구조평면도', 21], ['구조평면', '지붕바닥 구조평면도', 22], ['구조평면', '옥탑 구조평면도', 23],
        ['리스트·배근·상세', 'COLUMN LIST', 24], ['리스트·배근·상세', 'GIRDER LIST', 25], ['리스트·배근·상세', '슬래브 철근 배근도', 26],
        ['리스트·배근·상세', '옹벽 철근 배근도', 27], ['리스트·배근·상세', 'SECTION-A', 29], ['리스트·배근·상세', 'SECTION-B', 28],
        ['리스트·배근·상세', '잡배근도-5', 30]
      ] }
  ];
  const ALL = [];
  for (const s of SITES) s.sheets = s.sheets.map(([cat, name, i], k) => {
    const o = { site: s, cat, name, i, no: k + 1, id: s.id + '-' + String(k + 1).padStart(2, '0'), th: 'th/' + String(i).padStart(2, '0') + '.jpg' };
    ALL.push(o); return o;
  });
  const byId = new Map(ALL.map(o => [o.id, o]));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------- 목록 화면 ----------
  function sheetCard(o, showSite) {
    return `<a class="card" href="#${o.id}"><img src="${o.th}" alt="${esc(o.name)} 미리보기" loading="lazy">
      <div class="cap"><span class="no">${o.site.id.toUpperCase()}-${String(o.no).padStart(2, '0')}</span>
      <span class="nm">${esc(o.name)}${showSite ? `<span class="st">${esc(o.site.name)}</span>` : ''}</span></div></a>`;
  }
  function renderHome() {
    const q = $('q').value.trim().toLowerCase().replace(/\s+/g, '');
    if (q) {
      const hit = ALL.filter(o => (o.name + o.cat + o.site.name + o.site.addr).toLowerCase().replace(/\s+/g, '').includes(q));
      $('homeBody').innerHTML = hit.length
        ? `<div class="cat" style="margin-top:0"><h3><b>검색 결과</b>${hit.length}장</h3><div class="sheets">${hit.map(o => sheetCard(o, true)).join('')}</div></div>`
        : `<p class="empty">"${esc($('q').value)}"에 맞는 도면이 없습니다. 다른 말로 찾아보세요.</p>`;
      return;
    }
    $('homeBody').innerHTML = `<div class="sites">${SITES.map(s => {
      const cats = {}; s.sheets.forEach(o => cats[o.cat] = (cats[o.cat] || 0) + 1);
      const pics = s.cover.map(n => s.sheets[n - 1]);
      return `<a class="site" href="#${s.id}">
        <div class="ph">${pics.map(o => `<img src="${o.th}" alt="" loading="lazy">`).join('')}</div>
        <div class="meta"><span class="tag">현장 ${s.id.toUpperCase()}</span><h2>${esc(s.name)} · ${esc(s.project)}</h2>
        <span class="sub">${esc(s.addr)}</span><span class="sub">${esc(s.office)}</span>
        <div class="cnt"><span class="chip">${s.sheets.length}장</span>${Object.entries(cats).map(([c, n]) => `<span class="chip">${esc(c)} ${n}</span>`).join('')}</div></div></a>`;
    }).join('')}</div>`;
  }
  function renderSite(s) {
    $('siteCrumb').textContent = '현장 ' + s.id.toUpperCase();
    $('siteTitle').textContent = s.name + ' · ' + s.project;
    $('siteSub').textContent = s.addr + ' · ' + s.office + ' · ' + s.sheets.length + '장';
    const cats = [...new Set(s.sheets.map(o => o.cat))];
    $('siteBody').innerHTML = cats.map(c => {
      const list = s.sheets.filter(o => o.cat === c);
      return `<section class="cat"><h3><b>${esc(c)}</b>${list.length}장</h3><div class="sheets">${list.map(o => sheetCard(o)).join('')}</div></section>`;
    }).join('');
  }
  $('q').addEventListener('input', renderHome);

  // ---------- 라우팅 ----------
  let cur = null;
  function route() {
    const h = location.hash.replace('#', '');
    const sheet = byId.get(h), site = SITES.find(s => s.id === h);
    $('vHome').hidden = !!(sheet || site);
    $('vSite').hidden = !site;
    $('vView').hidden = !sheet;
    document.body.style.overflow = sheet ? 'hidden' : '';
    if (site) { renderSite(site); document.title = site.name + ' 도면'; window.scrollTo(0, 0); }
    else if (sheet) { openSheet(sheet); document.title = sheet.name + ' · ' + sheet.site.name; }
    else { renderHome(); document.title = '현장 도면 열람'; }
  }
  window.addEventListener('hashchange', route);

  // ================= 도면 뷰어 =================
  const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  let meta = null, Q = 10, groups = [], texts = [], rects = [];
  const hiddenLayers = new Set();
  let paper = store.get('dwg-paper') === '1';
  const view = { cx: 0, cy: 0, s: 1 };
  let W = 0, H = 0, dpr = 1;

  async function load(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error(url + ' 응답 ' + r.status);
    const b64 = (await r.text()).trim();
    const bin = atob(b64), buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    const ds = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Uint8Array(await new Response(ds).arrayBuffer());
  }
  let dataP = null;
  function ensureData() {
    if (!dataP) dataP = (async () => {
      const [mb, gb] = await Promise.all([load('meta.txt'), load('geom.txt')]);
      meta = JSON.parse(new TextDecoder().decode(mb)); Q = meta.q;
      rects = meta.sheets.map(s => s.r);
      build(gb);
      renderLayers();
    })();
    return dataP;
  }

  // 흰 배경 모드 색 변환
  const paperCache = new Map();
  function paperColor(c) {
    let v = paperCache.get(c); if (v) return v;
    const r = parseInt(c.slice(1, 3), 16), g = parseInt(c.slice(3, 5), 16), b = parseInt(c.slice(5, 7), 16);
    const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255, sat = (Math.max(r, g, b) - Math.min(r, g, b)) / 255;
    const k = sat < 0.15 ? (lum > 0.6 ? 0.08 : 0.45) : (lum > 0.6 ? 0.55 : 0.8);
    v = '#' + [r, g, b].map(x => Math.round(sat < 0.15 && lum > 0.6 ? 25 : x * k).toString(16).padStart(2, '0')).join('');
    paperCache.set(c, v); return v;
  }
  const col = c => paper ? paperColor(c) : c;
  const bgCol = () => paper ? '#ffffff' : '#0b0e12';

  // 그룹(레이어×색×종류)별, 공간 셀별 Path2D 구성
  function build(bin) {
    const dv = new DataView(bin.buffer, bin.byteOffset);
    const nC = dv.getUint32(0, true), nL = dv.getUint32(4, true);
    const C = new Int32Array(bin.buffer.slice(bin.byteOffset + 8, bin.byteOffset + 8 + nC * 4));
    const L = new Int32Array(bin.buffer.slice(bin.byteOffset + 8 + nC * 4, bin.byteOffset + 8 + nC * 4 + nL * 4));
    const vb = meta.view.map(v => v * Q);
    const GX = 48, GY = 24, cw = (vb[2] - vb[0]) / GX || 1, ch = (vb[3] - vb[1]) / GY || 1;
    for (const g of meta.groups) {
      const G = { layer: g.l, color: g.c, kind: g.k, cells: new Map(), items: [] };
      let p = g.p0, curH = null;
      for (let i = 0; i < g.nl; i++) {
        let n = L[g.n0 + i]; const start = n < 0; n = Math.abs(n);
        let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
        for (let j = 0; j < n; j++) { const x = C[(p + j) * 2], y = C[(p + j) * 2 + 1]; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
        let path;
        if (g.k === 'F' || g.k === 'H') {
          if (start || !curH) { curH = { path: new Path2D(), bb: [x0, y0, x1, y1] }; G.items.push(curH); }
          else { const b = curH.bb; b[0] = Math.min(b[0], x0); b[1] = Math.min(b[1], y0); b[2] = Math.max(b[2], x1); b[3] = Math.max(b[3], y1); }
          path = curH.path;
        } else {
          const gx = Math.max(0, Math.min(GX - 1, Math.floor(((x0 + x1) / 2 - vb[0]) / cw)));
          const gy = Math.max(0, Math.min(GY - 1, Math.floor(((y0 + y1) / 2 - vb[1]) / ch)));
          const key = gy * GX + gx;
          let cell = G.cells.get(key);
          if (!cell) { cell = { path: new Path2D(), bb: [x0, y0, x1, y1] }; G.cells.set(key, cell); }
          else { const b = cell.bb; if (x0 < b[0]) b[0] = x0; if (y0 < b[1]) b[1] = y0; if (x1 > b[2]) b[2] = x1; if (y1 > b[3]) b[3] = y1; }
          path = cell.path;
        }
        path.moveTo(C[p * 2], C[p * 2 + 1]);
        for (let j = 1; j < n; j++) path.lineTo(C[(p + j) * 2], C[(p + j) * 2 + 1]);
        if (g.k !== 'L') path.closePath();
        p += n;
      }
      G.cells = [...G.cells.values()];
      groups.push(G);
    }
    const ord = { H: 0, F: 1, S: 2, L: 3 };
    groups.sort((a, b) => ord[a.kind] - ord[b.kind]);
    texts = meta.texts.map(t => ({ x: t[0], y: t[1], h: t[2], a: t[3], s: t[4].split('\n'), al: t[5], l: t[6], c: t[7], wf: t[8] || 1 }));
  }

  let lastMs = 0, snap = null, snapView = null, snapPrev = { ...view };
  function resize() {
    const r = stage.getBoundingClientRect();
    if (!r.width) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    render();
  }
  function render() {
    if (!meta || $('vView').hidden) return;
    const t0 = performance.now();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = bgCol(); ctx.fillRect(0, 0, cv.width, cv.height);
    const k = dpr * view.s / Q;
    ctx.setTransform(k, 0, 0, -k, dpr * (W / 2 - view.cx * view.s), dpr * (H / 2 + view.cy * view.s));
    const hw = W / 2 / view.s, hh = H / 2 / view.s;
    const wb = [view.cx - hw, view.cy - hh, view.cx + hw, view.cy + hh].map(v => v * Q);
    ctx.lineWidth = dpr / k; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    const tiny = 0.6 * dpr / k;
    for (const G of groups) {
      if (hiddenLayers.has(G.layer)) continue;
      const c = col(G.color);
      if (G.kind === 'L' || G.kind === 'S') {
        if (G.kind === 'S') ctx.fillStyle = c; else ctx.strokeStyle = c;
        for (const cell of G.cells) {
          const b = cell.bb;
          if (b[2] < wb[0] || b[0] > wb[2] || b[3] < wb[1] || b[1] > wb[3]) continue;
          if (b[2] - b[0] < tiny && b[3] - b[1] < tiny) continue;
          if (G.kind === 'S') ctx.fill(cell.path); else ctx.stroke(cell.path);
        }
      } else {
        ctx.fillStyle = c; ctx.globalAlpha = G.kind === 'H' ? 0.22 : 1;
        for (const it of G.items) {
          const b = it.bb;
          if (b[2] < wb[0] || b[0] > wb[2] || b[3] < wb[1] || b[1] > wb[3]) continue;
          if (b[2] - b[0] < tiny && b[3] - b[1] < tiny) continue;
          ctx.fill(it.path, 'evenodd');
        }
        ctx.globalAlpha = 1;
      }
    }
    drawTexts(wb);
    drawMeasure();
    lastMs = performance.now() - t0; snap = null;
    $('hudS').textContent = '1px = ' + fmtLen(1 / view.s);
  }
  const fam = () => getComputedStyle(document.body).getPropertyValue('--font-ui');
  function drawTexts(wb) {
    ctx.textBaseline = 'alphabetic';
    const f = fam();
    const ox = dpr * (W / 2 - view.cx * view.s), oy = dpr * (H / 2 + view.cy * view.s), k = dpr * view.s / Q;
    let n = 0;
    for (const t of texts) {
      if (hiddenLayers.has(t.l)) continue;
      const px = t.h * view.s;
      if (px < 2.2) continue;
      const ext = t.h * Q * Math.max(1, t.s.length * 1.7) * Math.max(4, Math.max(...t.s.map(s => s.length)));
      if (t.x + ext < wb[0] || t.x - ext > wb[2] || t.y + ext < wb[1] || t.y - ext > wb[3]) continue;
      if (++n > 6000) break;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.translate(ox + t.x * k, oy - t.y * k); ctx.rotate(-t.a); ctx.scale(t.wf, 1);
      const fs = px * dpr;
      ctx.font = (fs / 0.72).toFixed(2) + 'px ' + f;   // 글자높이 ≈ 0.72em
      ctx.fillStyle = col(t.c);
      const isM = t.al >= 100, al = t.al % 100, ha = Math.floor(al / 10), va = al % 10;
      ctx.textAlign = ha === 1 ? 'center' : ha === 2 ? 'right' : 'left';
      const lh = fs * 1.66, total = (t.s.length - 1) * lh;
      const y0 = isM ? (va === 3 ? fs : va === 2 ? fs / 2 - total / 2 : -total) : (va === 3 ? fs : va === 2 ? fs / 2 : va === 1 ? -fs * 0.25 : 0);
      for (let i = 0; i < t.s.length; i++) ctx.fillText(t.s[i], 0, y0 + i * lh);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }
  // 무거운 화면은 조작 중 이전 화면을 변형해 보여주고, 멈추면 다시 그림
  let raf = 0, idleT = 0;
  function requestRender() {
    if (lastMs < 45) { cancelAnimationFrame(raf); raf = requestAnimationFrame(render); return; }
    if (!snap) { snap = document.createElement('canvas'); snap.width = cv.width; snap.height = cv.height; snap.getContext('2d').drawImage(cv, 0, 0); snapView = snapPrev; }
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const r = view.s / snapView.s;
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = bgCol(); ctx.fillRect(0, 0, cv.width, cv.height);
      const dx = (snapView.cx - view.cx) * view.s, dy = (view.cy - snapView.cy) * view.s;
      ctx.translate(dpr * (W / 2 + dx), dpr * (H / 2 + dy)); ctx.scale(r, r); ctx.translate(-dpr * W / 2, -dpr * H / 2);
      ctx.drawImage(snap, 0, 0); ctx.setTransform(1, 0, 0, 1, 0, 0);
    });
    clearTimeout(idleT); idleT = setTimeout(render, 140);
  }
  function changeView(fn) { if (!snap) snapPrev = { ...view }; fn(); requestRender(); }
  function fmtLen(mm) { return mm >= 1000 ? (mm / 1000).toFixed(mm >= 10000 ? 1 : 2) + ' m' : (mm >= 10 ? mm.toFixed(0) : mm.toFixed(1)) + ' mm'; }
  function fitBox(b, pad = 0.02) {
    const w = b[2] - b[0], h = b[3] - b[1];
    view.s = Math.min(W / (w * (1 + pad * 2)), H / (h * (1 + pad * 2)));
    view.cx = (b[0] + b[2]) / 2; view.cy = (b[1] + b[3]) / 2;
  }
  const toWorld = (sx, sy) => [view.cx + (sx - W / 2) / view.s, view.cy - (sy - H / 2) / view.s];
  const toScreen = (wx, wy) => [W / 2 + (wx - view.cx) * view.s, H / 2 - (wy - view.cy) * view.s];
  function zoomAt(sx, sy, f) {
    changeView(() => {
      const [wx, wy] = toWorld(sx, sy);
      view.s = Math.max(1e-4, Math.min(view.s * f, 200));
      view.cx = wx - (sx - W / 2) / view.s; view.cy = wy + (sy - H / 2) / view.s;
    });
  }

  // 도면 열기
  async function openSheet(o) {
    cur = o;
    $('vName').textContent = o.name;
    $('vSub').textContent = o.site.name + ' · ' + o.cat + ' · ' + (SITES.indexOf(o.site) >= 0 ? o.no + ' / ' + o.site.sheets.length : '');
    $('vBack').href = '#' + o.site.id;
    $('vPrev').disabled = o.no === 1; $('vNext').disabled = o.no === o.site.sheets.length;
    mA = mB = mHover = null; if (measuring) $('mtip').textContent = '첫 번째 점을 누르세요';
    $('loading').hidden = !!meta;
    try { await ensureData(); } catch (err) { $('loading').firstElementChild.textContent = '도면을 열지 못했습니다. 새로고침해 보세요. (' + err.message + ')'; return; }
    $('loading').hidden = true;
    if (cur !== o) return;
    const r = stage.getBoundingClientRect(); W = r.width; H = r.height;
    resize(); fitBox(rects[o.i - 1]); render();
  }
  const go = d => { if (!cur) return; const n = cur.site.sheets[cur.no - 1 + d]; if (n) location.hash = n.id; };
  $('vPrev').onclick = () => go(-1); $('vNext').onclick = () => go(1);
  $('vFit').onclick = () => { if (cur && meta) { fitBox(rects[cur.i - 1]); render(); } };

  // 입력: 드래그·휠·핀치
  const ptrs = new Map(); let moved = false, pinch0 = null;
  cv.addEventListener('pointerdown', e => {
    cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.offsetX, y: e.offsetY }); moved = false;
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = { d: Math.hypot(a.x - b.x, a.y - b.y), s: view.s }; }
    cv.classList.add('drag');
  });
  cv.addEventListener('pointermove', e => {
    if (!meta) return;
    const [wx, wy] = toWorld(e.offsetX, e.offsetY);
    $('hudXY').textContent = 'X ' + Math.round(wx + meta.origin[0]).toLocaleString() + '  Y ' + Math.round(wy + meta.origin[1]).toLocaleString();
    if (measuring && mA && !mB) { mHover = [wx, wy]; requestRender(); }
    const p = ptrs.get(e.pointerId); if (!p) return;
    const dx = e.offsetX - p.x, dy = e.offsetY - p.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    if (ptrs.size === 1) changeView(() => { view.cx -= dx / view.s; view.cy += dy / view.s; });
    else if (ptrs.size === 2 && pinch0) {
      p.x = e.offsetX; p.y = e.offsetY;
      const [a, b] = [...ptrs.values()];
      zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, (pinch0.s * Math.hypot(a.x - b.x, a.y - b.y) / pinch0.d) / view.s);
      return;
    }
    p.x = e.offsetX; p.y = e.offsetY;
  });
  const up = e => {
    ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = null; if (!ptrs.size) cv.classList.remove('drag');
    if (e.type === 'pointerup' && !moved && measuring) measureClick(e.offsetX, e.offsetY);
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.offsetX, e.offsetY, Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.0015))); }, { passive: false });
  cv.addEventListener('dblclick', e => zoomAt(e.offsetX, e.offsetY, 2));
  $('zIn').onclick = () => zoomAt(W / 2, H / 2, 1.6);
  $('zOut').onclick = () => zoomAt(W / 2, H / 2, 1 / 1.6);
  window.addEventListener('keydown', e => {
    if ($('vView').hidden || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft') go(-1); else if (e.key === 'ArrowRight') go(1);
    else if (e.key === '+' || e.key === '=') zoomAt(W / 2, H / 2, 1.4);
    else if (e.key === '-') zoomAt(W / 2, H / 2, 1 / 1.4);
    else if (e.key === 'Escape') { if (measuring && mA) { mA = mB = mHover = null; $('mtip').textContent = '첫 번째 점을 누르세요'; render(); } else location.hash = cur ? cur.site.id : ''; }
  });
  window.addEventListener('resize', () => { if (!$('vView').hidden) resize(); });

  // 거리 측정
  let measuring = false, mA = null, mB = null, mHover = null;
  $('vMeasure').onclick = () => {
    measuring = !measuring; mA = mB = mHover = null;
    $('vMeasure').setAttribute('aria-pressed', measuring); cv.classList.toggle('measure', measuring);
    $('mtip').hidden = !measuring; $('mtip').textContent = '첫 번째 점을 누르세요'; render();
  };
  function measureClick(sx, sy) {
    const w = toWorld(sx, sy);
    if (!mA || mB) { mA = w; mB = null; $('mtip').textContent = '두 번째 점을 누르세요'; }
    else { mB = w; const d = Math.hypot(mB[0] - mA[0], mB[1] - mA[1]); $('mtip').textContent = '거리 ' + Math.round(d).toLocaleString() + ' mm (' + fmtLen(d) + ')'; }
    render();
  }
  function drawMeasure() {
    if (!measuring || !mA) return;
    const b = mB || mHover; if (!b) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const [x1, y1] = toScreen(...mA), [x2, y2] = toScreen(...b);
    ctx.strokeStyle = '#ff3b6b'; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#ff3b6b';
    for (const [x, y] of [[x1, y1], [x2, y2]]) { ctx.beginPath(); ctx.arc(x, y, 4, 0, 7); ctx.fill(); }
    const d = Math.hypot(b[0] - mA[0], b[1] - mA[1]);
    ctx.font = '600 13px ' + getComputedStyle(document.body).getPropertyValue('--font-mono');
    const s = Math.round(d).toLocaleString() + ' mm', tw = ctx.measureText(s).width;
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 - 12;
    ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(mx - tw / 2 - 6, my - 14, tw + 12, 20);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(s, mx, my + 1);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  // 배경·레이어
  function setPaper(p) {
    paper = p; store.set('dwg-paper', p ? '1' : '0');
    $('vPaper').setAttribute('aria-pressed', p); $('stage').style.background = bgCol();
    if (meta) { renderLayers(); render(); }
  }
  $('vPaper').onclick = () => setPaper(!paper);
  $('vLayers').onclick = () => {
    const open = $('layerPanel').hidden; $('layerPanel').hidden = !open; $('vLayers').setAttribute('aria-pressed', open);
    requestAnimationFrame(resize);
  };
  function renderLayers() {
    if (!meta) return;
    const q = $('layerQ').value.trim().toLowerCase();
    $('layerList').innerHTML = '';
    for (const L of meta.layers) {
      if (q && !L.n.toLowerCase().includes(q)) continue;
      const lab = document.createElement('label'); lab.className = 'ly';
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !hiddenLayers.has(L.n);
      cb.onchange = () => { cb.checked ? hiddenLayers.delete(L.n) : hiddenLayers.add(L.n); render(); };
      const sw = document.createElement('span'); sw.className = 'sw'; sw.style.background = col(L.c);
      const nm = document.createElement('span'); nm.textContent = L.n;
      lab.append(cb, sw, nm); $('layerList').appendChild(lab);
    }
  }
  $('layerQ').oninput = renderLayers;
  $('lyAll').onclick = () => { hiddenLayers.clear(); renderLayers(); render(); };
  $('lyNone').onclick = () => { const q = $('layerQ').value.trim().toLowerCase(); meta.layers.forEach(L => { if (!q || L.n.toLowerCase().includes(q)) hiddenLayers.add(L.n); }); renderLayers(); render(); };

  // 시작: 목록을 먼저 보여주고, 도면 데이터는 뒤에서 미리 받아둠
  setPaper(paper);
  route();
  setTimeout(() => ensureData().catch(() => {}), 600);
  if (document.fonts) document.fonts.ready.then(() => { if (!$('vView').hidden) render(); });
})();
</script>
</body></html>
